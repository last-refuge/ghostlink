[package]
name = "ghostlink"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ghostlink"
path = "src/main.rs"

[dependencies]
ghostlink-platform = { path = "../platform" }
terminal-view = { path = "../terminal-view" }
session = { path = "../session" }
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
